<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06090e">
  <title>ROCKHARZ 2027 · Band Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Cinzel:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rockharz-theme.css?v=301">
</head>
<body>

  <!-- HEADER: Panorama mit Vollmond-Schloss, Dämonenhirschen und Schriftzug -->
  <header class="hero-banner-container">
    <div class="hero-banner-wrapper">
      <img src="assets/rockharz-banner-2027.jpg?v=301" alt="ROCKHARZ 2027 · Ballenstedt, Germany · 07.–10. Juli 2027 · Rock statt Reha" class="hero-banner-img" fetchpriority="high">
    </div>
  </header>

  <!-- NAVIGATION -->
  <nav class="action-bar-container" aria-label="Hauptnavigation">
    <div class="action-bar-inner">

      <div class="nav-tabs">
        <button type="button" class="nav-tab active" data-page="lineup">LINE-UP</button>
        <button type="button" class="nav-tab" data-page="favorites">FAVORITEN ★ <span class="tab-count">(<span id="nav-count-favorites">0</span>)</span></button>
        <button type="button" class="nav-tab" data-page="unrated">UNBEWERTET ◉ <span class="tab-count">(<span id="nav-count-unrated">0</span>)</span></button>
      </div>

      <div class="action-bar-right">
        <button type="button" class="export-pdf-btn" id="export" title="Line-Up als PDF drucken">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 20h16"/></svg>
          EXPORT PDF
        </button>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c4cfdc" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
          <input type="search" id="search" placeholder="Bands suchen ..." aria-label="Bands suchen" autocomplete="off">
          <button type="button" id="reset-view-btn" class="hidden" title="Suche leeren" aria-label="Suche leeren">✕</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- HAUPT-DASHBOARD -->
  <div class="rh-layout-wrapper">

    <main class="rh-main-content">
      <section id="page-lineup" class="page">
        <div id="band-grid" class="band-grid-concept"></div>
      </section>

      <section id="page-favorites" class="page hidden">
        <div class="heading-row"><h2>MEINE <em>FAVORITEN</em></h2></div>
        <div id="mine-grid" class="band-grid-concept"></div>
      </section>

      <section id="page-unrated" class="page hidden">
        <div class="heading-row"><h2>NOCH <em>UNBEWERTET</em></h2></div>
        <div id="unrated-grid" class="band-grid-concept"></div>
      </section>
    </main>

    <!-- MOBILE BACKDROP -->
    <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>

    <!-- RECHTER PLAYER -->
    <aside class="band-detail-drawer hidden" id="detail-drawer" aria-labelledby="detail-title">
      <span class="player-frame" aria-hidden="true"></span>

      <button type="button" class="drawer-close" id="drawer-close-btn" aria-label="Schließen">✕</button>

      <div class="drawer-scroll">
        <div class="drawer-header-art">
          <div class="drawer-art-wrap" id="detail-art-wrap">
            <img id="detail-img" src="" alt="" class="hidden" referrerpolicy="no-referrer">
            <div class="stag-relief-fallback" id="detail-fallback" aria-hidden="true"></div>
          </div>
        </div>

        <div class="drawer-content">
          <h2 id="detail-title">LÄDT …</h2>
          <div class="drawer-meta-line" id="detail-meta"></div>

          <p id="detail-desc" class="concept-desc"></p>

          <div class="drawer-section-title">TRACKLIST (HÖRPROBEN)</div>
          <div class="drawer-songs-list" id="detail-songs"></div>

          <div class="drawer-ratings-block" id="detail-rating-btns" role="group" aria-label="Deine Festival-Wertung"></div>
        </div>
      </div>

      <!-- Footer außerhalb des Scrollbereichs: immer sichtbar -->
      <div class="drawer-volume-section">
        <div class="volume-slider-row">
          <svg class="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" fill-opacity=".25"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
          <input type="range" id="master-volume" min="0" max="1" step="0.02" value="0.52" aria-label="Master-Lautstärke">
          <output class="vol-percent" id="volume-value" for="master-volume">52%</output>
        </div>
      </div>
    </aside>

  </div>

  <audio id="preview-audio" preload="none"></audio>
  <script src="bands.js?v=301"></script>
  <script src="app.js?v=301"></script>
</body>
</html>
