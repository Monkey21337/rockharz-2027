<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06090e">
  <title>ROCKHARZ 2027 · Band Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700;800;900&family=Cinzel:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="rockharz-theme.css?v=306">
</head>
<body>

  <!-- HEADER: Panorama (Desktop) bzw. kompaktes Motiv (Handy) -->
  <header class="hero-banner-container">
    <div class="hero-banner-wrapper">
      <picture>
        <source media="(max-width: 600px)" srcset="assets/banner-mobile-2027.jpg?v=306">
        <img src="assets/banner-desktop-2027.jpg?v=306" alt="ROCKHARZ 2027 · Ballenstedt, Germany · 07.–10. Juli 2027 · Rock statt Reha" class="hero-banner-img" fetchpriority="high">
      </picture>
    </div>
  </header>

  <!-- NAVIGATION -->
  <nav class="action-bar-container" aria-label="Hauptnavigation">
    <div class="action-bar-inner">

      <div class="nav-tabs">
        <button type="button" class="nav-tab active" data-page="lineup">LINE-UP</button>
        <button type="button" class="nav-tab" data-page="favorites">FAVORITEN ★ <span class="tab-count">(<span id="nav-count-favorites">0</span>)</span></button>
        <button type="button" class="nav-tab" data-page="unrated">UNBEWERTET ◉ <span class="tab-count">(<span id="nav-count-unrated">0</span>)</span></button>
      </div>

      <div class="action-bar-right">
        <button type="button" class="export-pdf-btn" id="export" title="Line-Up als PDF drucken">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-4.5-4.5M12 15l4.5-4.5M4 20h16"/></svg>
          <span><span class="export-label-long">EXPORT </span>PDF</span>
        </button>
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="#c4cfdc" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>
          <input type="search" id="search" placeholder="Bands suchen ..." aria-label="Bands suchen" autocomplete="off">
          <button type="button" id="reset-view-btn" class="hidden" title="Suche leeren" aria-label="Suche leeren">✕</button>
        </div>
        <button type="button" class="camp-user-btn" id="camp-user-btn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.9 3.1-6.4 7-6.4s7 2.5 7 6.4"/></svg>
          <span class="camp-user-name" id="camp-user-name">Name festlegen</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- HAUPT-DASHBOARD -->
  <div class="rh-layout-wrapper">

    <main class="rh-main-content">
      <section id="page-lineup" class="page">
        <div id="band-grid" class="band-grid-concept"></div>
      </section>

      <section id="page-favorites" class="page hidden">
        <div class="heading-row"><h2>MEINE <em>FAVORITEN</em></h2></div>
        <div id="mine-grid" class="band-grid-concept"></div>
      </section>

      <section id="page-unrated" class="page hidden">
        <div class="heading-row"><h2>NOCH <em>UNBEWERTET</em></h2></div>
        <div id="unrated-grid" class="band-grid-concept"></div>
      </section>
    </main>

    <!-- MOBILE BACKDROP -->
    <div id="drawer-backdrop" class="drawer-backdrop hidden"></div>

    <!-- RECHTER PLAYER -->
    <aside class="band-detail-drawer hidden" id="detail-drawer" aria-labelledby="detail-title">
      <span class="player-frame" aria-hidden="true"></span>

      <button type="button" class="drawer-close" id="drawer-close-btn" aria-label="Schließen">✕</button>

      <div class="drawer-scroll">
        <div class="drawer-header-art">
          <div class="drawer-art-wrap" id="detail-art-wrap">
            <img id="detail-img" src="" alt="" class="hidden" referrerpolicy="no-referrer">
            <div class="stag-relief-fallback" id="detail-fallback" aria-hidden="true"></div>
          </div>
          <!-- Camp-Zähler: nur Symbol + Zahl, keine Namen -->
          <button type="button" class="camp-count-badge drawer-camp-count" id="detail-camp-count" aria-controls="camp-popover" aria-expanded="false" hidden></button>
          <!-- Vor/Zurück (mobil sichtbar; zusätzlich Wischen und Pfeiltasten) -->
          <button type="button" class="drawer-step prev" id="drawer-prev" data-step="-1" aria-label="Vorherige Band">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <button type="button" class="drawer-step next" id="drawer-next" data-step="1" aria-label="Nächste Band">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>

        <div class="drawer-content">
          <h2 id="detail-title">LÄDT …</h2>
          <div class="drawer-meta-line" id="detail-meta"></div>

          <p id="detail-desc" class="concept-desc"></p>

          <div class="drawer-section-title drawer-tracklist-head">
            <span>TRACKLIST (HÖRPROBEN)</span>
            <a id="detail-amazon" class="amazon-link band-amazon-link" href="https://music.amazon.de" target="_blank" rel="noopener noreferrer">Amazon Music ↗</a>
          </div>
          <div class="drawer-songs-list" id="detail-songs"></div>

          <div class="drawer-ratings-block" id="detail-rating-btns" role="group" aria-label="Deine Festival-Wertung"></div>
        </div>
      </div>

      <!-- Footer außerhalb des Scrollbereichs: immer sichtbar -->
      <div class="drawer-volume-section">
        <div class="volume-slider-row">
          <svg class="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" fill-opacity=".25"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12"/></svg>
          <input type="range" id="master-volume" min="0" max="1" step="0.02" value="0.52" aria-label="Master-Lautstärke">
          <output class="vol-percent" id="volume-value" for="master-volume">52%</output>
        </div>
      </div>
    </aside>

  </div>

  <!-- Wer will die Band sehen? Erscheint beim Hover/Antippen des Camp-Zählers -->
  <div class="camp-popover" id="camp-popover" role="tooltip" hidden></div>

  <!-- CAMP-NAME: einmal festlegen, auf Handy und PC denselben Namen nutzen -->
  <div class="camp-modal-backdrop" id="camp-modal" hidden>
    <form class="camp-modal" id="camp-modal-form" role="dialog" aria-modal="true" aria-labelledby="camp-modal-title" aria-describedby="camp-modal-hint" novalidate>
      <span class="player-frame" aria-hidden="true"></span>
      <h2 id="camp-modal-title">Willkommen im Camp</h2>
      <p class="camp-modal-hint" id="camp-modal-hint">Nimm auf Handy und PC denselben Namen – dann sind deine Favoriten überall gleich.</p>
      <label for="camp-name-input">Dein Name / Spitzname im Camp</label>
      <input type="text" id="camp-name-input" maxlength="30" autocomplete="nickname" autocapitalize="words" spellcheck="false" required>
      <p class="camp-modal-error" id="camp-name-error" role="alert" hidden></p>
      <div class="camp-modal-actions">
        <button type="button" class="camp-modal-cancel" id="camp-modal-cancel">Später</button>
        <button type="submit" class="camp-modal-save">Speichern</button>
      </div>
    </form>
  </div>

  <audio id="preview-audio" preload="none"></audio>
  <!-- Firebase (Compat-CDN, ohne Build-Tools); fällt bei Blockade sauber auf lokales Speichern zurück -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="bands.js?v=306"></script>
  <script src="app.js?v=306"></script>
</body>
</html>
